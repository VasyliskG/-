<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ханойська Вежа — Modern Pink</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #ffe4f1, #ffd1dc);
    color: #333;
}

/* ===== Controls ===== */
.controls {
    margin: 20px auto;
    display: flex;
    justify-content: center;
    gap: 10px;
}

input {
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ff8fb1;
    outline: none;
}

button {
    padding: 10px 16px;
    border: none;
    border-radius: 10px;
    background: #ff4d88;
    color: white;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #e63c76;
}

/* ===== Layout ===== */
.container {
    display: flex;
    justify-content: center;
    gap: 60px;
    margin-top: 30px;
}

.tower {
    width: 140px;
    height: 320px;
    position: relative;
    border-radius: 16px;
    background: rgba(255,255,255,0.4);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 25px rgba(255, 105, 180, 0.2);
}

.rod {
    position: absolute;
    width: 10px;
    height: 260px;
    background: #ff7aa8;
    left: 50%;
    transform: translateX(-50%);
    bottom: 20px;
    border-radius: 10px;
}

/* ===== Disks ===== */
.disk {
    position: absolute;
    height: 22px;
    border-radius: 12px;
    left: 50%;
    transform: translateX(-50%);
    transition: all 0.5s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: white;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

/* ===== Steps ===== */
.steps {
    max-height: 220px;
    overflow-y: auto;
    margin: 20px auto;
    width: 80%;
    background: white;
    border-radius: 16px;
    padding: 15px;
    box-shadow: 0 10px 20px rgba(255, 105, 180, 0.2);
}

.step {
    font-family: monospace;
    padding: 6px 0;
    border-bottom: 1px solid #f3c1d3;
}

.step span {
    color: #ff4d88;
    font-weight: bold;
}
</style>
</head>

<body>

<h2 style="text-align:center;">💗 Ханойська Вежа — Modern Animation</h2>

<div class="controls">
    <input type="number" id="n" value="4" min="1" max="8">
    <button onclick="start()">Старт</button>
</div>

<div class="container">
    <div class="tower" id="A"><div class="rod"></div></div>
    <div class="tower" id="B"><div class="rod"></div></div>
    <div class="tower" id="C"><div class="rod"></div></div>
</div>

<div class="steps" id="steps"></div>

<script>
let towers = { A: [], B: [], C: [] };
let step = 0;

const wait = ms => new Promise(r => setTimeout(r, ms));

function logStep(disk, from, to) {
    step++;
    const div = document.createElement("div");
    div.className = "step";
    div.innerHTML = `<span>Крок ${step}:</span> диск ${disk} → ${from} → ${to}`;
    document.getElementById("steps").appendChild(div);
}

function createDisks(n) {
    towers = { A: [], B: [], C: [] };
    step = 0;

    document.getElementById("steps").innerHTML = "";

    const A = document.getElementById("A");
    A.querySelectorAll(".disk").forEach(d => d.remove());

    for (let i = n; i >= 1; i--) {
        const disk = document.createElement("div");
        disk.className = "disk";
        disk.style.width = (30 + i * 18) + "px";
        disk.style.background = `linear-gradient(135deg, hsl(${330 - i*10}, 90%, 65%), #ff4d88)`;
        disk.innerText = i;

        A.appendChild(disk);
        towers.A.push(disk);
        update(disk, "A");
    }
}

function update(disk, towerName) {
    const index = towers[towerName].indexOf(disk);
    disk.style.bottom = (index * 24 + 10) + "px";
}

async function move(from, to) {
    const disk = towers[from].pop();
    towers[to].push(disk);

    disk.style.transform = "translate(-50%, -220px)";
    await wait(250);

    document.getElementById(to).appendChild(disk);
    update(disk, to);

    disk.style.transform = "translate(-50%, 0)";
    logStep(disk.innerText, from, to);

    await wait(500);
}

async function hanoi(n, from, to, aux) {
    if (n === 0) return;

    await hanoi(n - 1, from, aux, to);
    await move(from, to);
    await hanoi(n - 1, aux, to, from);
}

async function start() {
    const n = +document.getElementById("n").value;
    createDisks(n);
    await hanoi(n, "A", "C", "B");
}
</script>

</body>
</html>
